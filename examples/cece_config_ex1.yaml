# Basic single species example with small grid
driver:
  start_time: "2010-01-01T00:00:00"
  end_time: "2010-01-01T23:00:00"
  timestep_seconds: 3600
  grid:
    grid_name: "F180"
    lon_min: -180.0
    lon_max: 180.0
    lat_min: -90.0
    lat_max: 90.0

meteorology: {}

species:
  nox:
    - field: "nox"
      operation: "add"
      scale: 1.0

cece_data:
  streams:
    - name: "MACCITY"
      file: "/gpfs/f6/bil-fire3/world-shared/Emissions/nexus/HTAP/v2015-03/NO/EDGAR_HTAP_NO_TRANSPORT.generic.01x01.nc"
      yearFirst: 2000
      yearLast: 2010
      yearAlign: 2020
      taxmode: "cycle"
      tintalgo: "linear"
      mapalgo: "consd"
      data_model: "classic"
      variables:
        - file: "emi_no"
          model: "nox"

diagnostics:
  output_interval_seconds: 3600
  variables: ["no"]

output:
  enabled: true
  directory: ./cece_output
  filename_pattern: "cece_ex1_{YYYY}{MM}{DD}_{HH}{mm}{ss}.nc"
  frequency_steps: 1
  fields:
    - nox
